<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050307">
<meta name="description" content="Alpha Music — a premium music player for Bangla, English, Hindi, DJ, Russian and more.">
<title>Alpha Music</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23050307'/%3E%3Ccircle cx='16' cy='16' r='9' fill='none' stroke='%23ff2e57' stroke-width='2'/%3E%3Ccircle cx='16' cy='16' r='3' fill='%239a4dff'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css?v=4">
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5v14l11-7z" fill="currentColor" stroke="none"/></symbol>
    <symbol id="i-pause" viewBox="0 0 24 24"><path d="M7 5h4v14H7zM13 5h4v14h-4z" fill="currentColor" stroke="none"/></symbol>
    <symbol id="i-prev" viewBox="0 0 24 24"><path d="M6 5h2v14H6zM20 5v14L9 12z" fill="currentColor" stroke="none"/></symbol>
    <symbol id="i-next" viewBox="0 0 24 24"><path d="M16 5h2v14h-2zM4 5v14l11-7z" fill="currentColor" stroke="none"/></symbol>
    <symbol id="i-shuffle" viewBox="0 0 24 24"><path d="M3 7h3c4 0 6 10 10 10h5M3 17h3c1.5 0 2.7-1 3.7-2.3M14.3 9.3C15 8.4 16 7 18 7h3M18 4l3 3-3 3M18 14l3 3-3 3"/></symbol>
    <symbol id="i-repeat" viewBox="0 0 24 24"><path d="M4 11V9a3 3 0 0 1 3-3h13M17 3l3 3-3 3M20 13v2a3 3 0 0 1-3 3H4M7 21l-3-3 3-3"/></symbol>
    <symbol id="i-repeat1" viewBox="0 0 24 24"><path d="M4 11V9a3 3 0 0 1 3-3h13M17 3l3 3-3 3M20 13v2a3 3 0 0 1-3 3H4M7 21l-3-3 3-3M11 10.5l1.5-1v6"/></symbol>
    <symbol id="i-vol" viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9z" fill="currentColor" stroke="none"/><path d="M16 9a4 4 0 0 1 0 6M18.5 6.5a8 8 0 0 1 0 11"/></symbol>
    <symbol id="i-mute" viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9z" fill="currentColor" stroke="none"/><path d="M17 9l5 6M22 9l-5 6"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6"/><path d="M20 20l-4.2-4.2"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-viz" viewBox="0 0 24 24"><path d="M5 20V12M9.5 20V5M14.5 20V9M19 20v-5"/></symbol>
    <symbol id="i-sliders" viewBox="0 0 24 24"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></symbol>
    <symbol id="i-back" viewBox="0 0 24 24"><path d="M5 12a7 7 0 1 0 2.2-5.1M5 4v4h4"/><text x="12" y="15.5" text-anchor="middle" font-size="8" font-weight="700" fill="currentColor" stroke="none">10</text></symbol>
    <symbol id="i-fs" viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></symbol>
    <symbol id="i-fsx" viewBox="0 0 24 24"><path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"/></symbol>
    <symbol id="i-fwd" viewBox="0 0 24 24"><path d="M19 12a7 7 0 1 1-2.2-5.1M19 4v4h-4"/><text x="12" y="15.5" text-anchor="middle" font-size="8" font-weight="700" fill="currentColor" stroke="none">10</text></symbol>
  </defs>
</svg>

<div class="app">

  <!-- LIBRARY: categories on top, every song below -->
  <section id="library" class="panel" aria-label="Music library">
    <header class="lhead">
      <h1 class="brand">Alpha <span>Music</span></h1>
      <div class="htools">
        <label class="search">
          <svg class="i"><use href="#i-search"/></svg>
          <input id="q" type="search" placeholder="Search music" aria-label="Search music" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="search">
        </label>
        <button id="btnViz" class="tb" type="button" aria-label="Visualizer" title="Visualizer" aria-haspopup="true" aria-expanded="false" aria-pressed="false"><svg class="i"><use href="#i-viz"/></svg><span>Visualizer</span></button>
        <button id="btnDj" class="tb" type="button" aria-label="DJ Tools" title="DJ Tools" aria-haspopup="true" aria-expanded="false"><svg class="i"><use href="#i-sliders"/></svg><span>DJ Tools</span></button>
        <button id="btnFs" class="tb" type="button" aria-label="Enter full screen" title="Full screen" aria-pressed="false" hidden><svg class="i"><use href="#i-fs"/></svg></button>
      </div>
    </header>

    <div id="cats" class="cats" role="group" aria-label="Category">
      <button class="cat" type="button" data-cat="all" aria-pressed="true">All<span class="n"></span></button>
      <button class="cat" type="button" data-cat="bangla" aria-pressed="false">Bangla<span class="n"></span></button>
      <button class="cat" type="button" data-cat="english" aria-pressed="false">English<span class="n"></span></button>
      <button class="cat" type="button" data-cat="hindi" aria-pressed="false">Hindi<span class="n"></span></button>
      <button class="cat" type="button" data-cat="other" aria-pressed="false">Other<span class="n"></span></button>
      <button class="cat" type="button" data-cat="dj" aria-pressed="false">DJ<span class="n"></span></button>
      <button class="cat" type="button" data-cat="party" aria-pressed="false">Party<span class="n"></span></button>
      <button class="cat" type="button" data-cat="sakrain" aria-pressed="false">For Sakrain<span class="n"></span></button>
      <button class="cat" type="button" data-cat="russian" aria-pressed="false">Music Russian<span class="n"></span></button>
    </div>

    <div class="listwrap">
      <div id="list" class="list" role="list" aria-label="All music">
        <div id="spacer" class="spacer"></div>
      </div>
      <div id="msg" class="msg" hidden>
        <p id="msgText"></p>
        <button id="retry" class="btn" type="button" hidden>Try again</button>
      </div>
    </div>
  </section>

  <!-- PLAYER -->
  <section id="player" class="panel" aria-label="Player">
    <div class="art-wrap">
      <div class="art" id="art">
        <div class="art-fb" id="artFb"><span id="artLetter">♪</span></div>
        <img id="artImg" alt="Cover" hidden decoding="async" referrerpolicy="no-referrer">
        <canvas id="viz" aria-hidden="true"></canvas>
      </div>
    </div>

    <div class="info">
      <h2 id="title" class="title">Choose a song</h2>
      <p id="sub" class="sub">Tap any track in the list</p>
    </div>

    <div class="seek">
      <input id="seek" class="range" type="range" min="0" max="0" step="1" value="0" aria-label="Seek" disabled>
      <div class="times"><time id="tCur">0:00</time><time id="tDur">0:00</time></div>
    </div>

    <div class="ctrl">
      <button id="bShuffle" class="cb" type="button" aria-label="Shuffle: off" aria-pressed="false"><svg class="i"><use href="#i-shuffle"/></svg></button>
      <button id="bPrev" class="cb skip" type="button" aria-label="Previous track"><svg class="i"><use href="#i-prev"/></svg></button>
      <button id="bBack" class="cb" type="button" aria-label="Back 10 seconds"><svg class="i"><use href="#i-back"/></svg></button>
      <button id="bPlay" class="cb play" type="button" aria-label="Play"><svg class="i"><use href="#i-play"/></svg></button>
      <button id="bFwd" class="cb" type="button" aria-label="Forward 10 seconds"><svg class="i"><use href="#i-fwd"/></svg></button>
      <button id="bNext" class="cb skip" type="button" aria-label="Next track"><svg class="i"><use href="#i-next"/></svg></button>
      <button id="bRepeat" class="cb" type="button" aria-label="Repeat: off" aria-pressed="false"><svg class="i"><use href="#i-repeat"/></svg></button>
    </div>

    <div class="extra">
      <div class="volwrap" id="volwrap">
        <button id="bMute" class="cb sm" type="button" aria-label="Mute" aria-pressed="false"><svg class="i"><use href="#i-vol"/></svg></button>
        <input id="vol" class="range" type="range" min="0" max="100" step="1" value="100" aria-label="Volume">
      </div>
      <label class="speed"><span class="sr">Playback speed</span><select id="speed"></select></label>
    </div>

    <div class="up" aria-live="polite">
      <span class="up-l">Up next</span>
      <span id="upText" class="up-t">—</span>
      <button id="qClear" class="clear" type="button" hidden>Clear queue</button>
    </div>
  </section>

</div>

<!-- Floating panels (overlay, no layout space) -->
<div id="popViz" class="pop pop-viz" role="dialog" aria-label="Visualizer" hidden>
  <div class="pop-top"><h3>Visualizer</h3></div>
  <div class="vmodes">
    <button type="button" data-mode="spectrum" aria-pressed="false">Spectrum</button>
    <button type="button" data-mode="bars" aria-pressed="false">Bars</button>
    <button type="button" data-mode="wave" aria-pressed="false">Waveform</button>
    <button type="button" data-mode="circle" aria-pressed="false">Circle</button>
    <button type="button" data-mode="off" class="off" aria-pressed="true">Off</button>
  </div>
</div>

<div id="popDj" class="pop pop-dj" role="dialog" aria-label="DJ Tools" data-on="0" hidden>
  <div class="pop-top"><h3>DJ Tools</h3><span class="state">Processing <b id="djState">OFF</b></span></div>

  <fieldset>
    <legend>Equalizer</legend>
    <label class="ctl"><span>Bass</span><input class="range" type="range" min="-20" max="20" step="1" value="0" data-fx="bass"><output>0 dB</output></label>
    <label class="ctl"><span>Mid</span><input class="range" type="range" min="-12" max="12" step="1" value="0" data-fx="mid"><output>0 dB</output></label>
    <label class="ctl"><span>Treble</span><input class="range" type="range" min="-12" max="12" step="1" value="0" data-fx="treble"><output>0 dB</output></label>
  </fieldset>
  <fieldset>
    <legend>Loudness</legend>
    <label class="ctl"><span>Volume boost</span><input class="range" type="range" min="-12" max="12" step="1" value="0" data-fx="gain"><output>0 dB</output></label>
  </fieldset>
  <fieldset>
    <legend>Filter</legend>
    <label class="ctl"><span>High-pass</span><input class="range" type="range" min="0" max="100" step="1" value="0" data-fx="hp"><output>Off</output></label>
    <label class="ctl"><span>Low-pass</span><input class="range" type="range" min="0" max="100" step="1" value="100" data-fx="lp"><output>Off</output></label>
  </fieldset>
  <fieldset>
    <legend>Echo</legend>
    <label class="ctl"><span>Mix</span><input class="range" type="range" min="0" max="100" step="1" value="0" data-fx="echo"><output>Off</output></label>
    <label class="ctl"><span>Delay</span><input class="range" type="range" min="0.1" max="0.8" step="0.05" value="0.3" data-fx="echoTime"><output>0.30 s</output></label>
  </fieldset>
  <fieldset>
    <legend>Reverb</legend>
    <label class="ctl"><span>Mix</span><input class="range" type="range" min="0" max="100" step="1" value="0" data-fx="reverb"><output>Off</output></label>
  </fieldset>
  <fieldset>
    <legend>Between songs</legend>
    <label class="ctl"><span>Fade</span><input class="range" type="range" min="0" max="12" step="1" value="0" data-fx="fade"><output>Off</output></label>
  </fieldset>
  <div class="set"><label for="fxPitch">Keep pitch when speed changes</label><input id="fxPitch" class="sw" type="checkbox" checked></div>
  <button id="fxReset" class="btn" type="button">Reset all effects</button>
</div>

<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
<noscript><p style="padding:16px">Alpha Music needs JavaScript to play audio.</p></noscript>
<script src="script.js?v=5" defer></script>
</body>
</html>
